name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on branches finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # The browser tests don't depend on the Node version, so one leg runs them.
      - if: matrix.node == 22
        run: npx playwright install --with-deps
      - if: matrix.node == 22
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure() && matrix.node == 22
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
