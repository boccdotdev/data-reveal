<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./head.js"></script>
  <link rel="stylesheet" href="./fixture.css">
  <title>Inner scroller</title>
  <style>
    body { padding: 0; }
    header { height: 300px; background: #bbb; }
    /* Fills the rest of the 720px viewport: 420px, with its 85% line at 357px. */
    #scroller { height: calc(100vh - 300px); overflow: auto; }
    /* With the box's 8px margin and fade's 20px starting offset, the element's
       top sits 335px into the scroller: above the scroller's 85% line, but at
       635px in the window, below the window's (612px). */
    .above { height: 307px; }
    .below { height: 1500px; }
    /* The window scrolls too, so measuring against it gives a different answer. */
    footer { height: 600px; }
  </style>
</head>
<body>
  <header>Header outside the scroller</header>
  <div id="scroller">
    <div class="above"></div>
    <div id="fade" class="box" data-reveal="fade" data-reveal-duration="0.2">fade</div>
    <div class="below"></div>
  </div>
  <footer>Footer outside the scroller</footer>
  <script type="module" src="./harness.js"></script>
</body>
</html>
