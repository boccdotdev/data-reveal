<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./head.js"></script>
  <link rel="stylesheet" href="./fixture.css">
  <title>SVG</title>
  <style>
    .pair { display: flex; gap: 40px; }
    svg { width: 300px; height: 200px; overflow: visible; }
    .twin { visibility: hidden; }
  </style>
</head>
<body>
  <p>Reveals on SVG elements, each next to an unrevealed twin.</p>
  <div class="gap"></div>
  <div class="pair">
    <svg viewBox="0 0 300 200"><rect id="rect" x="100" y="70" width="100" height="60" fill="#888" data-reveal="rotate" data-reveal-axis="z" data-reveal-duration="0.6"></rect></svg>
    <svg viewBox="0 0 300 200"><rect id="rect-twin" class="twin" x="100" y="70" width="100" height="60" fill="#888"></rect></svg>
  </div>
  <div class="gap"></div>
  <div class="pair">
    <svg viewBox="0 0 300 200"><rect id="slow" x="100" y="70" width="100" height="60" fill="#888" data-reveal="rotate" data-reveal-axis="z" data-reveal-duration="4"></rect></svg>
    <svg viewBox="0 0 300 200"><rect id="slow-twin" class="twin" x="100" y="70" width="100" height="60" fill="#888"></rect></svg>
  </div>
  <div class="gap"></div>
  <script type="module" src="./harness.js"></script>
</body>
</html>
