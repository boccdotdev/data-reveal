<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./head.js"></script>
  <link rel="stylesheet" href="./fixture.css">
  <title>Every type</title>
</head>
<body>
  <p>Every built-in type, each a screen apart.</p>
  <div class="gap"></div>
  <div id="fade" class="box" data-reveal="fade" data-reveal-duration="0.2">fade</div>
  <div class="gap"></div>
  <div id="scale" class="box" data-reveal="scale" data-reveal-duration="0.2">scale</div>
  <div class="gap"></div>
  <h2 id="split" data-reveal="split" data-reveal-duration="0.2" data-reveal-stagger="0">Split heading</h2>
  <div class="gap"></div>
  <ul id="batch" data-reveal="batch" data-reveal-duration="0.2" data-reveal-stagger="0">
    <li data-reveal-item>one</li>
    <li data-reveal-item>two</li>
  </ul>
  <div class="gap"></div>
  <div id="blur" class="box" data-reveal="blur" data-reveal-duration="0.2">blur</div>
  <div class="gap"></div>
  <div id="clip" class="box" data-reveal="clip" data-reveal-duration="0.2">clip</div>
  <div class="gap"></div>
  <div id="rotate" class="box" data-reveal="rotate" data-reveal-duration="0.2">rotate</div>
  <div class="gap"></div>
  <div id="slide" class="box" data-reveal="slide" data-reveal-duration="0.2">slide</div>
  <div class="gap"></div>
  <div id="counter" class="box" data-reveal="counter" data-reveal-duration="0.2" data-reveal-to="1200" data-reveal-separator=",">0</div>
  <div class="gap"></div>
  <div id="parallax" class="box" data-reveal="parallax" data-reveal-speed="0.5">parallax</div>
  <div class="gap"></div>
  <script type="module" src="./harness.js"></script>
</body>
</html>
